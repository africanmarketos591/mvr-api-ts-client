name: Build and Publish TypeScript Client

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v-prefixed tag to publish after a recoverable registry-workflow failure"
        required: false
        type: string
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build package
        run: npm run build

      - name: Run client regression tests
        run: npm test

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install supported npm for trusted publishing
        run: npm install -g npm@11.6.4

      - name: Verify release tag matches package version
        shell: bash
        run: |
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          package_version="$(node -p "require('./package.json').version")"
          test "$release_tag" = "v$package_version"

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
